---
- name: Administrar servidores Ubuntu
  hosts: docker
  gather_facts: yes

  tasks:

    - name: Mostrar nombre del servidor
      debug:
        msg: "Nombre del servidor: {{ ansible_hostname }}"

    - name: Mostrar sistema operativo
      debug:
        msg: "Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Crear directorio principal
      file:
        path: /tmp/ansible-demo
        state: directory
        mode: '0755'

    - name: Crear archivo info.txt
      copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ ansible_hostname }}
          Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}

    - name: Crear directorios mediante un loop
      file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - logs
        - backup
        - config

    - name: Mostrar mensaje si el sistema operativo es Ubuntu
      debug:
        msg: "Este servidor está utilizando Ubuntu."
      when: ansible_facts["distribution"] == "Ubuntu"